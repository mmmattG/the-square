[tips-and-tricks-item-description]
the-square-mod=Core rules and mechanics for this mod.
the-square-overview=This mod replaces the normal open map with a square that starts small and expands one ring at a time. The playable area is always the inside of the current square. Anything outside it is inaccessible void, and every expansion adds exactly one tile on each side.\n\nThe Square starts centered on the spawn. Use the Move square button and its Square / Contents toggle either to move the playable area while factory contents stay at their world coordinates, or to shift factory entities and placed tiles while the Square and players stay fixed. Ingress and Egress add or move their belt and pipe connections along the Boundary to stay aligned with the shifted factory. A direction is unavailable when the selected move would leave players or blocking entities in the Void; belts and pipes correctly connected to Ingress and Egress may remain when moving the Square.\n\nThe run is meant to stay within this border, so compact layouts and rebuilds are part of the normal flow.
the-square-expansion-research=Square growth is driven directly by science. Every completed level of square-expansion research immediately grows the map by one ring.\n\nThe research line climbs through science bands in blocks: levels 1-10 use automation science, 11-20 add logistic science, 21-30 add chemical science, 31-40 add production and utility science, and level 41 onward continues infinitely with all science through space. The research count still scales with the size of the next ring and the map setting for tiles per research pack.\n\nThe status panel shows completed expansion levels and the next science band.
the-square-ingress-lines=Resources do not come from patches inside the square. Instead, you place an Ingress in an anchor slot on the current edge, and it brings a raw resource in from outside the map. An Egress does the opposite: it takes a resource out of your factory and vents it outward.\n\nNauvis starts with one Fluid Ingress and two Item Ingress in the player's inventory. Other planets start with none; bring them through normal interplanetary logistics or craft more when needed. You can mine a placed Ingress or Egress to put it back in your inventory, then place it again on another empty anchor slot for free. Item and fluid ones can share sides, but Fluid Ingress and Egress must keep at least one empty anchor slot between them.\n\nWhen the square expands, placed Ingress and Egress move outward automatically and keep the connection going. Ones in your inventory do nothing until placed again.
the-square-uranium-egress=Sulfuric acid Egress unlocks with uranium mining. Uranium ore Ingress only runs while a sulfuric acid Egress is actually removing sulfuric acid from your factory.\n\nThe uranium allowance uses the same sulfuric-acid-to-ore relationship as vanilla uranium mining, including mining productivity. All placed sulfuric acid Egress combine into one shared allowance pool, and all placed uranium ore Ingress draw from that same shared pool. One sulfuric acid Egress does not grant full throughput to every uranium Ingress.
the-square-research-and-rewards=Faster Ingress and Egress come from their own research after Logistics, Logistics 2 and Logistics 3, matching those belts. Square expansion research steps through broader science over time, then continues as an infinite all-science technology from level 41.
the-square-anchor-upgrades=Faster Ingress and Egress come from research, in steps.\n\nDual-lane comes first and upgrades the ones you already own: Item Ingress and Egress (the yellow belt tier) use both belt lanes, and Fluid Ingress and Egress move twice as much.\n\nAfter that, Fast (red belt) and Express (blue belt) research, and Turbo (green belt) in Space Age, unlock faster Item Ingress and Egress. Craft each one from the tier below plus Anchor Frames. The ones you own keep their tier. To swap one, open its anchor, pick the new tier and the resource, and you get the old one back. Fluid Ingress and Egress have only one tier.\n\nAnchor slot rules and mining them back are the same for every tier.
