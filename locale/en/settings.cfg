[technology-description]
the-square-square-expansion=Repeatable research that expands the square by one ring each time a level completes. Its cost scales with the next ring's tile reward and the map setting for tiles per research pack. It starts on red science and steps up to broader science-pack sets every 10 levels.
the-square-planet-square-expansion=Infinite research that expands the managed square on __1__ by one ring. It uses only that planet's science pack and scales from the 17x17 planet baseline.
the-square-ingress-dual-lane=Item Ingress and Item Egress (the yellow belt tier) use both belt lanes, and Fluid Ingress and Egress move twice as much. This upgrades the ones you already own. Requires Logistics.
the-square-ingress-red=Unlocks Fast Item Ingress and Fast Item Egress, the red belt tier. Craft them from the tier below and Anchor Frames. They run at red belt speed. The ones you own keep their tier until you swap them. Requires Logistics 2.
the-square-ingress-blue=Unlocks Express Item Ingress and Express Item Egress, the blue belt tier. Craft them from the tier below and Anchor Frames. They run at blue belt speed. The ones you own keep their tier until you swap them. Requires Logistics 3.
the-square-egress-turbo=Unlocks Turbo Item Ingress and Turbo Item Egress, the green belt tier. Craft them from the tier below and Anchor Frames. They run at green belt speed. The ones you own keep their tier until you swap them. Requires Turbo transport belt.

